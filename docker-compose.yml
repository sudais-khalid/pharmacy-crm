services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pharmacy_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pharmacy:${POSTGRES_PASSWORD}@db:5432/pharmacy_crm?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
      # Set to 1 only when a reverse proxy in front of the app sets X-Forwarded-For
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Developer account, created on the very first start only
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
    ports:
      - "3000:3000"
    healthcheck:
      # node:22-slim has no curl; Node's fetch does the job. 503 (database down) fails the check.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Background jobs and outbox delivery. Same image as app; waits for app to apply migrations.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pharmacy:${POSTGRES_PASSWORD}@db:5432/pharmacy_crm?schema=public
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
    command: ["node", "dist/worker.js"]

volumes:
  pgdata:
