services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pharmacy_crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmacy -d pharmacy_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pharmacy:${POSTGRES_PASSWORD}@db:5432/pharmacy_crm?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Karachi}
    ports:
      - "3000:3000"

volumes:
  pgdata:
