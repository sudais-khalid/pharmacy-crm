<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection - Pharmacy CRM</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #0f172a; padding: 16px; box-sizing: border-box; }
  main { max-width: 26rem; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.25rem; margin: 16px 0 8px; }
  p { margin: 0 0 16px; color: #475569; }
  button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 0; background: #1f7f78; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #e2e8f0; } p { color: #94a3b8; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>No connection to the pharmacy server</h1>
  <p>Check the Wi-Fi or mobile data, then try again. Stock entries are saved on the server as drafts while you type, so you can carry on from the last saved line.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
