name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 for servers, 24 because the desktop app runs the same code on Electron's Node 24
        node: [22, 24]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: pharmacy_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy -d pharmacy_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pharmacy:ci_password@localhost:5432/pharmacy_crm_test?schema=public
      SMOKE_DATABASE_URL: postgresql://pharmacy:ci_password@localhost:5432/pharmacy_crm_smoke?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      APP_TIMEZONE: Asia/Karachi
      NEXT_TELEMETRY_DISABLED: "1"
      PLATFORM_OWNER_EMAIL: owner@example.com
      PLATFORM_OWNER_PASSWORD: ci-owner-password-123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Module boundaries
        run: npm run lint:deps

      - name: Prepare test database
        run: |
          printf 'DATABASE_URL="%s"\nJWT_SECRET="%s"\nAPP_TIMEZONE="%s"\n' "$TEST_DATABASE_URL" "$JWT_SECRET" "$APP_TIMEZONE" > .env.test
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Migrations match the Prisma schema
        env:
          PGPASSWORD: ci_password
          SHADOW_DATABASE_URL: postgresql://pharmacy:ci_password@localhost:5432/pharmacy_crm_shadow
        run: |
          psql -h localhost -U pharmacy -d pharmacy_crm_test -c "CREATE DATABASE pharmacy_crm_shadow"
          npm run db:check

      - name: Integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke and tenant isolation tests against the built app
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U pharmacy -d pharmacy_crm_test -c "CREATE DATABASE pharmacy_crm_smoke"
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          npx prisma migrate deploy
          ALLOW_DEMO_SEED=1 npm run db:seed
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          BASE_URL=http://localhost:3000 bash scripts/smoke.sh
          BASE_URL=http://localhost:3000 node scripts/isolation-check.mjs

      # roadmap 9.6: the journeys from creating a pharmacy to receiving an order, in a browser
      - name: End-to-end journeys
        if: matrix.node == 22
        run: |
          npx playwright install --with-deps chromium
          node scripts/e2e-local.mjs

      - name: Keep end-to-end screenshots and traces
        if: failure() && matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/e2e
          retention-days: 7

      - name: Show server log on failure
        if: failure()
        run: test -f next.log && tail -n 200 next.log || true

  # The Windows app: supervisor, embedded PostgreSQL, backups, restore, console controls, shortcuts and
  # client mode, run headless against throwaway data folders.
  desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build the server folder
        run: npm run build:desktop

      - name: Unit tests and self-test
        working-directory: desktop
        run: |
          npm test
          npm run selftest
