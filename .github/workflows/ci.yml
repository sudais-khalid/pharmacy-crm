name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pharmacy
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: pharmacy_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmacy -d pharmacy_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://pharmacy:ci_password@localhost:5432/pharmacy_crm_test?schema=public
      SMOKE_DATABASE_URL: postgresql://pharmacy:ci_password@localhost:5432/pharmacy_crm_smoke?schema=public
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      APP_TIMEZONE: Asia/Karachi
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Module boundaries
        run: npm run lint:deps

      - name: Prepare test database
        run: |
          printf 'DATABASE_URL="%s"\nJWT_SECRET="%s"\nAPP_TIMEZONE="%s"\n' "$TEST_DATABASE_URL" "$JWT_SECRET" "$APP_TIMEZONE" > .env.test
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy

      - name: Integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test against the built app
        env:
          PGPASSWORD: ci_password
        run: |
          psql -h localhost -U pharmacy -d pharmacy_crm_test -c "CREATE DATABASE pharmacy_crm_smoke"
          export DATABASE_URL="$SMOKE_DATABASE_URL"
          npx prisma migrate deploy
          npm run db:seed
          npx next start -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          BASE_URL=http://localhost:3000 bash scripts/smoke.sh

      - name: Show server log on failure
        if: failure()
        run: test -f next.log && tail -n 200 next.log || true
